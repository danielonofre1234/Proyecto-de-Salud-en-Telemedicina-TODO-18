<div class="appointments-page">

<!-- NAVBAR (lo mantienes) -->
<app-navbar></app-navbar>

<h1>📅 Gestión de citas</h1>

<button class="back-btn" (click)="goBack()">⬅ Volver</button>

<!-- FORMULARIO -->
<div class="form">

<h2>Agendar cita</h2>

<div class="form-group">
<label>👨‍⚕️ Seleccionar psicólogo</label>
<select [(ngModel)]="selectedPsychologist" class="select-pro">
<option value="">Seleccionar psicólogo</option>
<option *ngFor="let p of psychologists" [value]="p.name">
{{p.name}}
</option>
</select>
</div>

<div class="form-group">
<label>📅 Fecha</label>
<input 
[(ngModel)]="date" 
type="date" 
class="input-pro"
[class.day-full]="isDayFull()"
[min]="today"
>
</div>

<div class="form-group">
<label>⏰ Hora</label>

<div class="time-picker">

<button 
*ngFor="let t of timeSlots"
(click)="selectTime(t)"
[class.active]="time === t"
[disabled]="isTimeBlocked(t)"
class="time-btn"
>
{{t}}
</button>

</div>

</div>

<div class="form-group">
<label>🧠 Motivo</label>
<input [(ngModel)]="topic" placeholder="Motivo de la sesión" class="input-pro">
</div>

<button class="btn-create" (click)="createAppointment()">
Crear cita
</button>

</div>

<!-- LISTA DE CITAS -->
<h2>Mis citas</h2>

<div *ngIf="appointments.length === 0">
No hay citas registradas
</div>

<div class="appointments-list">

<div class="card" *ngFor="let a of appointments; let i = index">

<h3>{{a.patientName}}</h3>

<p><b>🧠 Psicólogo:</b> {{a.psychologist}}</p>
<p><b>📅 Fecha:</b> {{a.date}}</p>
<p><b>⏰ Hora:</b> {{a.time}}</p>
<p><b>🧩 Motivo:</b> {{a.topic}}</p>

<p><b>📌 Estado:</b> {{a.status}}</p>

<button (click)="enterSession(i)">
Entrar a sesión
</button>

</div>

</div>

</div>
