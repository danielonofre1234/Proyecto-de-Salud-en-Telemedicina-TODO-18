<div class="appointments-page">

<!-- NAVBAR (lo mantienes) -->
<app-navbar></app-navbar>

<h1>📅 Gestión de citas</h1>

<button class="back-btn" (click)="goBack()">⬅ Volver</button>

<!-- FORMULARIO -->
<div class="form">

<h2>Agendar cita</h2>

<input [(ngModel)]="patientName" placeholder="Nombre del paciente">

<input [(ngModel)]="psychologist" placeholder="Psicólogo">

<input [(ngModel)]="date" type="date">

<input [(ngModel)]="time" type="time">

<input [(ngModel)]="topic" placeholder="Motivo de la sesión">

<button (click)="createAppointment()">
Crear cita
</button>

</div>

<!-- LISTA DE CITAS -->
<h2>Mis citas</h2>

<div *ngIf="appointments.length === 0">
No hay citas registradas
</div>

<div class="appointments-list">

<div class="card" *ngFor="let a of appointments; let i = index">

<h3>{{a.patientName}}</h3>

<p><b>🧠 Psicólogo:</b> {{a.psychologist}}</p>
<p><b>📅 Fecha:</b> {{a.date}}</p>
<p><b>⏰ Hora:</b> {{a.time}}</p>
<p><b>🧩 Motivo:</b> {{a.topic}}</p>

<p><b>📌 Estado:</b> {{a.status}}</p>

<button (click)="enterSession(i)">
Entrar a sesión
</button>

</div>

</div>

</div>
